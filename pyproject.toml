[project]
name = "graph-rag"
version = "0.1.0"
description = "Graph-augmented retrieval experiments for biomedical RAG (AUTH diploma thesis)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Alexandros Melis" }]
dependencies = [
    "biopython>=1.84",
    "bm25s>=0.2",
    "huggingface-hub>=0.26",
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-google-genai>=2.0,<3",
    "langchain-groq>=0.2,<0.4",
    "langchain-ollama>=0.2,<0.4",
    "langchain-text-splitters>=0.3,<0.4",
    "matplotlib>=3.9",
    "mlflow>=3.1",
    "neo4j>=5.28",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "ragas>=0.2.14,<0.3",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "seaborn>=0.13",
    "sentence-transformers>=3.3",
    "temporalio>=1.33",
    "tiktoken>=0.8",
    "torch>=2.6",
    "torch-geometric>=2.6",
    "tqdm>=4.66",
    "typer>=0.15",
]

[project.scripts]
graph-rag = "graph_rag.cli:app"

[project.optional-dependencies]
entities = [
    "gliner>=0.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
markers = ["temporal: starts a local Temporal dev server (downloaded on first use)"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
